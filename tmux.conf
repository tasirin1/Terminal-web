# tmux: sesi tetap hidup saat halaman di-refresh / koneksi putus
set -g default-terminal "tmux-256color"
set -g history-limit 20000
set -g window-size latest
set -g aggressive-resize on
set -g escape-time 10
set -g focus-events on
set -g base-index 1
set -g renumber-windows on

# mouse aktif -> geser satu jari di terminal membuka copy-mode (riwayat);
# Esc atau q untuk keluar dari copy-mode.
set -g mouse on
setw -g mode-keys vi

# status bar tipis (nama sesi + jam)
set -g status-style "bg=#161b24,fg=#93a1b3"
set -g status-left "#[fg=#4f9cf9,bold] #S #[default]"
set -g status-right "#[fg=#93a1b3]%H:%M "
set -g status-interval 30
set -g lock-after-time 0
